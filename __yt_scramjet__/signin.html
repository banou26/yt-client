<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in - YT client</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0f0f0f; color: #aaa; font: 14px Roboto, Arial, sans-serif; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
      .spinner { width: 36px; height: 36px; border: 3px solid #3f3f3f; border-top-color: #3ea6ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .error, .stopped, .close { display: none; }
      .error, .stopped { margin: 0; color: #ff8a80; }
      .close { height: 36px; padding: 0 16px; border: 0; border-radius: 18px; background: #f1f1f1; color: #0f0f0f; font: 500 14px Roboto, Arial, sans-serif; cursor: pointer; }
      iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; visibility: hidden; }
      :is([data-stage='error'], [data-stage='stopped']) :is(.spinner, iframe) { display: none; }
      [data-stage='error'] .error, [data-stage='stopped'] .stopped { display: block; }
      :is([data-stage='error'], [data-stage='stopped']) .close { display: block; }
    </style>
    <script src="/__yt_scramjet__/scramjet/scramjet.js"></script>
    <script src="/__yt_scramjet__/controller/controller.api.js"></script>
    <script type="module" src="/src/scramjet/signin-window.ts"></script>
  </head>
  <body>
    <div class="spinner"></div>
    <p class="error">Sign-in could not start. Close this window and try again.</p>
    <p class="stopped">Sign-in stopped. Close this window and try again.</p>
    <button type="button" class="close">Close</button>
  </body>
</html>
