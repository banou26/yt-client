enum LikeStatus {
  LIKE
  DISLIKE
  INDIFFERENT
}

enum NotificationLevel {
  ALL
  PERSONALIZED
  NONE
}

# The three values the create endpoint accepts. `Playlist.privacy` on the READ
# side stays a String: it echoes whatever the playlist header carries, and a
# value outside this set must degrade to text rather than fail the whole query.
enum PlaylistPrivacy {
  PUBLIC
  UNLISTED
  PRIVATE
}

type Channel {
  id: ID!
  name: String!
  avatar: String
  handle: String
  subscriberCountText: String
  videoCountText: String
  banner: String
  description: String
  isSubscribed: Boolean
  notificationLevel: NotificationLevel
  isVerified: Boolean
  # An official artist channel, badged with a music note instead of the check.
  isVerifiedArtist: Boolean
}

type Video {
  id: ID!
  title: String!
  description: String
  descriptionSnippet: String
  thumbnail: String
  # Every still upstream published for this video, already formatted as a
  # srcset. The same Video renders at ~360px in a grid and ~168px in the watch
  # sidebar, so no single URL is right for both: `thumbnail` stays the fallback
  # for anything that cannot express a slot width, and this lets the browser
  # pick per slot and per pixel ratio.
  thumbnailSrcset: String
  durationSeconds: Int
  viewCount: String
  publishedText: String
  # An exact ISO 8601 time, set only where upstream gives one (channelUploads).
  # Lists that merge several channels sort on it.
  publishedAt: String
  isLive: Boolean
  # 0-100 watch progress, for the red bar across the thumbnail. Only feeds that
  # carry a resume overlay (history, home) populate it.
  progressPercent: Int
  # A premiere or a scheduled stream: it has a page but nothing to play yet, so
  # a card must not offer it as watchable the way a finished video is.
  isUpcoming: Boolean
  # Vertical, and 9:16 in the grid. Shorts reach the normalizers as their own
  # node kind, so this is set at the source rather than guessed from duration.
  isMembersOnly: Boolean
  isShort: Boolean
  # Upstream's own badge texts (4K, CC, New), already localized. Kept as text
  # because the vocabulary changes and an unknown badge should still render.
  badges: [String!]!
  channel: Channel
}

type VideoPage {
  items: [Video!]!
  # Playlist rows carried by the same page. A channel's Playlists, Releases and
  # Podcasts tabs consist only of these, so a page that could describe videos
  # alone reported all three as empty.
  playlists: [Playlist!]!
  cursor: String
}

# One slide of the Shorts pager, and deliberately not a Video. The reel
# sequence answers with an id and a portrait still per entry but metadata for
# only one of them, so `title` is genuinely absent for most slides and the
# pager fetches the rest per slide as each becomes active.
type Short {
  id: ID!
  # The true 1080x1920 frame. A feed lockup carries the same frame letterboxed
  # into 16:9, so this is the better still wherever it exists.
  poster: String
  title: String
}

type ShortsPage {
  items: [Short!]!
  cursor: String
}

# A feed that YouTube groups under headings, like History's day boundaries.
# The grouping is the point of the page, so it is not flattened away.
type VideoSection {
  title: String
  items: [Video!]!
}

type SectionedVideoPage {
  sections: [VideoSection!]!
  cursor: String
}

# The id is the chip's continuation token, never its label: the label is
# localized and changes with hl.
type FeedChip {
  id: ID!
  label: String!
  selected: Boolean!
}

type HomeFeed {
  items: [Video!]!
  # The Shorts shelf, kept out of `items` because the grid renders it as its own
  # carousel row. Every page can carry one, not just the first.
  shorts: [Video!]!
  chips: [FeedChip!]!
  cursor: String
}

# Search ranks channels and playlists above videos for a name query, so a
# video-only page silently drops the best answer. The source tags every row with
# its kind, which keeps __resolveType a pure field switch in the worker rather
# than a second place that has to know youtubei.js node shapes.
union SearchResult = Video | Channel | Playlist

type SearchPage {
  results: [SearchResult!]!
  # Upstream's "did you mean" and related-query chips, as plain query strings.
  refinements: [String!]!
  estimatedResults: Float
  cursor: String
}

# Upstream's own vocabulary, lowercased by the source before it reaches
# youtubei.js. ALL is the unset state rather than a filter that gets sent.
enum SearchUploadDate {
  ALL
  TODAY
  WEEK
  MONTH
  YEAR
}

enum SearchType {
  ALL
  VIDEO
  SHORTS
  CHANNEL
  PLAYLIST
  MOVIE
}

enum SearchDuration {
  ALL
  UNDER_THREE_MINS
  THREE_TO_TWENTY_MINS
  OVER_TWENTY_MINS
}

# youtubei.js only encodes these two orderings. 'Upload date' and 'Rating' are
# reachable at runtime through the response's own sub_menu endpoints, which
# carry pre-baked params, so they are deliberately NOT modelled here as if they
# were a free choice.
enum SearchSort {
  RELEVANCE
  POPULARITY
}

enum SearchFeature {
  HD
  SUBTITLES
  CREATIVE_COMMONS
  THREE_D
  LIVE
  PURCHASED
  FOUR_K
  THREE_SIXTY
  LOCATION
  HDR
  VR180
}

input SearchFilters {
  uploadDate: SearchUploadDate
  type: SearchType
  duration: SearchDuration
  sortBy: SearchSort
  features: [SearchFeature!]
}

# The tabs a channel can expose. Which ones actually exist varies per channel,
# so a page reports its own `availableTabs` rather than the UI assuming a set.
enum ChannelTab {
  HOME
  VIDEOS
  SHORTS
  LIVE
  RELEASES
  PODCASTS
  COURSES
  PLAYLISTS
  COMMUNITY
  ABOUT
  SEARCH
}

type Notification {
  id: ID!
  # The whole line as upstream writes it ("Blender uploaded ..."), already
  # localized. There is no separate title or channel name on this node.
  message: String!
  sentText: String
  # The channel avatar, and the video still where the notification is about one.
  avatar: String
  thumbnail: String
  # Where tapping it goes. Absent when the endpoint is a kind this client does
  # not route, in which case the row is shown but not linked.
  videoId: String
  read: Boolean
}

type NotificationPage {
  items: [Notification!]!
  cursor: String
}

type ChannelLink {
  title: String!
  # The destination itself, unwrapped from upstream's redirect page.
  url: String!
  # The short form upstream shows for it, such as "lnk.to/abc".
  displayUrl: String
}

# The About panel. Reached through its own call rather than as a field on
# ChannelPage: getAbout() is a second round trip, and as its own query it is
# made once per channel rather than once per tab.
type ChannelAbout {
  description: String
  country: String
  joinedDateText: String
  viewCountText: String
  subscriberCountText: String
  videoCountText: String
  canonicalUrl: String
  links: [ChannelLink!]!
}

# A community post. `attachment` is deliberately reduced to the parts a card can
# render: the node behind it is a whole union (poll, image, video, playlist) and
# modelling all of it belongs with the surface that would show it.
type Post {
  id: ID!
  author: Channel
  text: String!
  publishedText: String
  voteCountText: String
  attachedVideo: Video
  attachedImage: String
}

type PostPage {
  items: [Post!]!
  cursor: String
}

# A row of a channel's Home tab. Upstream fills a row with one kind of item,
# so normally only one of the lists has entries.
type ChannelShelf {
  title: String!
  subtitle: String
  # Upstream's own path for the row's title (a playlist, or one of the
  # channel's tabs), which the app's routes accept as they are.
  url: String
  videos: [Video!]!
  shorts: [Video!]!
  playlists: [Playlist!]!
  channels: [Channel!]!
}

type ChannelHome {
  featured: Video
  # In upstream's order. Rows of a kind this client does not render, such as
  # posts, are left out.
  shelves: [ChannelShelf!]!
}

type ChannelPage {
  channel: Channel!
  # Empty on the Home tab, which is `home` instead.
  videos: VideoPage!
  # Only the tabs this channel really has, in upstream's display order.
  availableTabs: [ChannelTab!]!
  tab: ChannelTab!
  # Sort options for the current tab, as upstream's own localized labels. The
  # applied one is echoed back so the control can show what is active.
  sortOptions: [String!]!
  appliedSort: String
  # Only on the Home tab.
  home: ChannelHome
}

# The queue rail beside the player, present only when /watch was opened inside a
# playlist. Deliberately NOT a Playlist: `currentIndex` describes the video being
# watched rather than the playlist, so two videos from one playlist would fight
# over it if this were normalized on the playlist id. See src/graphql.ts.
type WatchPlaylist {
  id: ID!
  title: String
  # The owner byline as upstream renders it. A mix is bylined "YouTube" with no
  # channel behind it, so this is display text rather than a Channel.
  author: String
  items: [Video!]!
  # 0-based, and it is the SERVER's answer rather than the requested one: an
  # out-of-range playlistIndex comes back corrected here.
  currentIndex: Int
  # A mix or radio: the queue is generated as you watch, so `items` is a window
  # onto it rather than the whole playlist.
  isInfinite: Boolean
}

type WatchMeta {
  id: ID!
  # The watch page branches on this instead of mounting a player: live playback
  # is not wired, and letting the player try produces three failed attempts and
  # an internal error string.
  isLive: Boolean
  # Viewers watching now, which upstream carries in place of a total view count
  # while a stream is live.
  concurrentViewers: Int
  title: String
  # The exact count and date, which the expanded description shows.
  viewCountText: String
  publishedDateText: String
  # The rounded count ('1.8B views') and the relative date ('17y ago') the
  # collapsed description shows instead.
  shortViewCountText: String
  relativeDateText: String
  # The hashtags upstream lists beside the counts, each with its '#'.
  hashtags: [String!]!
  likeCountText: String
  commentCountText: String
  description: String
  # The description as runs, so its links and chapter timestamps work. `text`
  # above stays for the collapsed clamp.
  descriptionRuns: [TextRun!]!
  likeStatus: LikeStatus
  channel: Channel
  related: [Video!]!
  # Present when the sidebar has more to load. Pass it to `relatedVideos`, the
  # same shape `Comment.repliesCursor` uses: `related` stays a plain list so the
  # busiest query in the app keeps its selection unchanged.
  relatedCursor: String
  # The video youtube.com's own autoplay moves on to, which is often not the
  # first related one. Null when upstream names none.
  autoplayId: ID
  # Null unless the watch query passed a playlistId.
  playlist: WatchPlaylist
}

# One segment of a rich text body. Upstream hands text back as runs, each of
# which may carry an endpoint, and collapsing them to a plain string is what
# makes URLs, mentions and 12:34 timestamps inert.
#
# The four kinds are distinguished by which target field is set, rather than by
# an enum, so a run whose endpoint is a kind this client does not model still
# renders as its own text instead of disappearing.
type TextRun {
  text: String!
  # An off-site link.
  url: String
  # A /watch link. `startSeconds` is what makes a description chapter or a
  # comment timestamp seek rather than reload the page.
  videoId: String
  startSeconds: Int
  # A channel, hashtag or other browse target.
  browseId: String
}

type Comment {
  id: ID!
  author: Channel
  text: String!
  # The same body as `text`, segmented. `text` stays for the collapsed clamp and
  # for anything that only needs a plain string.
  runs: [TextRun!]!
  isLiked: Boolean
  isDisliked: Boolean
  isCreator: Boolean
  isMember: Boolean
  publishedText: String
  likeCountText: String
  replyCount: Int
  isPinned: Boolean
  isHearted: Boolean
  # Present only when the comment has replies. Pass it to `commentReplies`.
  repliesCursor: String
  # Opaque handle for this comment's own like, dislike and reply endpoints.
  # Absent when the read carried no commands, which is what signed out looks
  # like, so a control without one should not be rendered.
  actionsToken: String
}

# One rendered line of live chat. Paid messages (Super Chats) carry an amount
# and their own colours; everything else leaves those absent.
type LiveChatMessage {
  id: ID!
  author: Channel
  text: String!
  # Segmented, because a chat line is mostly custom emoji: those arrive as runs
  # with an image and no meaningful text.
  runs: [LiveChatRun!]!
  timestampText: String
  isOwner: Boolean
  isModerator: Boolean
  isMember: Boolean
  purchaseAmountText: String
  headerBackgroundColor: String
  bodyBackgroundColor: String
}

# A text run, or a custom emoji, which renders as an image.
type LiveChatRun {
  text: String!
  url: String
  videoId: String
  startSeconds: Int
  browseId: String
  emojiUrl: String
  emojiLabel: String
}

type LiveChatPage {
  items: [LiveChatMessage!]!
  # Poll this for whatever arrives next. Absent once the chat has ended, which
  # is what tells the client to stop.
  cursor: String
  # Ids the server retracted. The client holds the transcript, so a removal has
  # to travel as its own instruction rather than as an absence from a later page.
  removedIds: [ID!]
  # Chat is off for this video. Distinct from an empty page, which just means
  # nothing was said since the last poll.
  disabled: Boolean
}

type CommentPage {
  items: [Comment!]!
  cursor: String
  disabled: Boolean
  # The comments header's own count, which is exact. The /next-derived text on
  # WatchMeta is a rounded teaser and needed a regex to read.
  countText: String
}

# youtubei.js encodes only these two orderings, and passing one to getComments
# costs a single round trip where Comments.applySort costs two.
enum CommentSort {
  TOP
  NEWEST
}

type Playlist {
  id: ID!
  title: String!
  description: String
  thumbnail: String
  # Counts arrive as localized strings ("50 videos", "1,204 views"), never as
  # numbers, so they are carried through as text rather than parsed.
  videoCountText: String
  viewCountText: String
  updatedText: String
  # PUBLIC / UNLISTED / PRIVATE, but the vocabulary is upstream's and changes,
  # so it stays a String rather than an enum the client would have to exhaust.
  privacy: String
  isEditable: Boolean
  canDelete: Boolean
  canReorder: Boolean
  channel: Channel
}

# An entry wraps its Video instead of extending it. `setVideoId` identifies the
# SLOT, not the video, and removing or reordering an entry needs it: the same
# video can sit in one playlist twice, each occurrence with its own setVideoId.
type PlaylistItem {
  video: Video!
  setVideoId: String
  # 1-BASED, unlike WatchPlaylist.currentIndex and Query.watch's playlistIndex,
  # which are 0-based. This one is upstream's own row number and it is what a
  # `&index=` link addresses, so it travels through the UI unshifted and is
  # converted only where it reaches the query.
  index: Int
}

type PlaylistPage {
  # Repeated on every page: a continuation response carries no playlist header,
  # so the source replays the one read from the first page.
  playlist: Playlist!
  items: [PlaylistItem!]!
  cursor: String
}

type PlaylistListPage {
  items: [Playlist!]!
  cursor: String
}

# One account on the signed-in Google login.
type Account {
  # The account's position in the login, which becomes X-Goog-Authuser. It is
  # the identity because it is the only handle the transport accepts: there is
  # no runtime switch that takes anything else.
  index: Int!
  name: String
  avatar: String
  handle: String
  selected: Boolean
  # A brand account with no channel cannot be browsed as one.
  hasChannel: Boolean
}

type Session {
  signedIn: Boolean!
  name: String
  avatar: String
  handle: String
  # Every account on this login, including the selected one. Comes off the same
  # response the header avatar does, so listing them costs no extra round trip.
  accounts: [Account!]!
}

type Query {
  # `chip` is a FeedChip.id; omitting it is the All feed. Applying one costs a
  # second browse round trip on top of the base feed.
  home(chip: ID, cursor: String): HomeFeed!
  # `seed` names the short to open on; the sequence follows from it. With no
  # seed the home shelf supplies one, so a signed-out session has no Shorts
  # feed rather than an error.
  shorts(seed: ID, cursor: String): ShortsPage!
  # Signed-in only. youtubei.js refuses these before the network call when
  # signed out, so callers gate on `session.signedIn` rather than firing a
  # request that cannot succeed.
  subscriptions(cursor: String): VideoPage!
  history(cursor: String): SectionedVideoPage!
  # Only the first page of the list unless `all` is set, which follows it to
  # the end at one request per page (capped at 20 pages).
  subscribedChannels(all: Boolean): [Channel!]!
  # A channel's 15 newest long uploads (no Shorts, no live streams), from its
  # public feed. `channelId` must be of the UC form. A feed that cannot be read,
  # a 404 included, is an error rather than an empty list. The rows carry no
  # duration, live state or channel avatar: a query must not select those, or
  # it writes nulls over what other views cached for the same video.
  channelUploads(channelId: ID!): [Video!]!
  # Results are heterogeneous: see the SearchResult union. A cursor is bound to
  # the query AND the filter set that minted it, so changing a filter starts a
  # fresh feed rather than paging the previous one's results.
  search(query: String!, filters: SearchFilters, cursor: String): SearchPage!
  # Free-text suggestions for the search box. Not an InnerTube call: it reads
  # suggestqueries-clients6.youtube.com through the same rewritten fetch, so it
  # is one tunneled round trip per call and callers must debounce.
  searchSuggestions(query: String!, previousQuery: String): [String!]!
  video(id: ID!): Video
  # `tab` defaults to the channel's own landing tab. `query` only applies to the
  # SEARCH tab and is ignored elsewhere. `sort` is one of the page's own
  # `sortOptions` labels.
  channel(id: ID!, tab: ChannelTab, sort: String, query: String, cursor: String): ChannelPage!
  # Null when the channel publishes no About panel, which is an ordinary state
  # rather than a failure: `ChannelPage.availableTabs` is what says whether to
  # ask at all.
  channelAbout(id: ID!): ChannelAbout
  communityPosts(channelId: ID!, cursor: String): PostPage!
  # `playlistId` puts the video in a queue: the same /next call then also returns
  # the playlist panel. `playlistIndex` is 0-based, and the server corrects an
  # out-of-range one rather than failing, so read the position back off
  # `playlist.currentIndex` instead of assuming the request was honoured.
  watch(id: ID!, playlistId: ID, playlistIndex: Int): WatchMeta
  # A cursor is bound to the sort that minted it: switching order has to start a
  # new feed rather than page the previous ordering's results.
  comments(videoId: ID!, sort: CommentSort, cursor: String): CommentPage!
  # Polled rather than subscribed: the whole transport is one response per
  # request. Call without a cursor to open the chat, then follow the cursor it
  # returns. A poll parks on the server until something arrives or it times out,
  # so an empty page is a heartbeat rather than a reason to back off.
  liveChat(videoId: ID!, cursor: String): LiveChatPage!
  # Replies to one comment. The cursor comes from `Comment.repliesCursor` and
  # names its thread, so no video or comment id is needed alongside it.
  commentReplies(cursor: String!): CommentPage!
  # More of the watch sidebar. The cursor comes from `WatchMeta.relatedCursor`
  # and names the video it belongs to, so no id is needed alongside it.
  relatedVideos(cursor: String!): VideoPage!
  # Signed-in only, like `subscriptions` and `history`: the library aggregation
  # browse is refused before the network call when signed out.
  playlists(cursor: String): PlaylistListPage!
  # NOT gated: a public playlist opens signed out. An inaccessible one comes
  # back as an upstream error rather than as an empty page.
  playlist(id: ID!, cursor: String): PlaylistPage!
  # Signed-in only. Polling is the caller's business: each call is a tunneled
  # round trip, so the header polls slowly and only while the tab is visible.
  notifications(cursor: String): NotificationPage!
  unseenNotificationCount: Int!
  session: Session!
}

# Writes return the affected entity rather than a Boolean so the normalized
# cache can merge the new state into every view already rendering it: liking on
# the watch page updates the same video wherever else it is on screen.
#
# The returned entity carries ONLY the identity and the fields the write
# changed. A mutation document must not select anything else off it (the rest is
# not fetched back, and a non-null field like Channel.name would then fail).
type Mutation {
  rateVideo(id: ID!, status: LikeStatus!): WatchMeta!
  # Resolves to the removed video id so the cache can drop it from the feed.
  removeFromHistory(videoId: ID!): ID!
  # Resolves to a Boolean, not a Comment: upstream answers a create with an
  # opaque response carrying no parseable comment, and a fabricated id would
  # poison the normalized cache. The composer prepends its own row instead.
  postComment(videoId: ID!, text: String!): Boolean!
  # Sends through the chat session the panel already has open, so it fails
  # rather than silently opening a second poll of the same stream.
  sendLiveChatMessage(videoId: ID!, text: String!): Boolean!
  replyToComment(actionsToken: String!, text: String!): Boolean!
  rateComment(actionsToken: String!, status: LikeStatus!): Comment!
  # Resolves to the notification id so the cache can mark just that row read.
  markNotificationRead(id: ID!): ID!
  setSubscribed(channelId: ID!, subscribed: Boolean!): Channel!
  setNotificationLevel(channelId: ID!, level: NotificationLevel!): Channel!
  addToPlaylist(playlistId: ID!, videoIds: [ID!]!): Playlist!
  # Entries are addressed by `setVideoId`, never by video id: the same video can
  # sit in one playlist twice and only the setVideoId says which row to drop.
  # PlaylistItem.setVideoId is where the caller gets them.
  removeFromPlaylist(playlistId: ID!, setVideoIds: [ID!]!): Playlist!
  # `privacy` and `description` are only settable AT CREATION. See
  # setPlaylistPrivacy for why the edit path is weaker than this one.
  createPlaylist(title: String!, videoIds: [ID!], privacy: PlaylistPrivacy, description: String): Playlist!
  # Resolves to the deleted id so the cache can drop it from the library list.
  deletePlaylist(id: ID!): ID!
  renamePlaylist(id: ID!, title: String!): Playlist!
  setPlaylistDescription(id: ID!, description: String!): Playlist!
  # The one write here whose upstream action name is not attested by youtubei.js
  # 18.3.0. It is sent verbatim and may be ignored by the server; the resolved
  # entity is optimistic either way. Prefer setting privacy through
  # createPlaylist, which goes through an endpoint the library does implement.
  setPlaylistPrivacy(id: ID!, privacy: PlaylistPrivacy!): Playlist!
  # `afterSetVideoId` is the entry the moved one lands AFTER; omitting it asks
  # for the first position.
  movePlaylistItem(playlistId: ID!, setVideoId: ID!, afterSetVideoId: ID): Playlist!
}
